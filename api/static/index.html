<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent chat</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1c1c1a; --muted:#62625c; --line:#deded8; --me:#e6edfb; --bot:#fff; --accent:#2b59c3; --warn:#a8570b; --warn-bg:#fbeedd; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --panel:#1f1f1d; --ink:#ecece8; --muted:#a2a29a; --line:#34342f; --me:#24304f; --bot:#1f1f1d; --accent:#8fb0ff; --warn:#f0b36a; --warn-bg:#3a2b17; --bad:#ff9a92; } }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  header h1 { margin:0; font-size:16px; }
  header small { color:var(--muted); }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; max-width:760px; width:100%; margin:0 auto; }
  .msg { padding:9px 13px; border-radius:12px; max-width:85%; white-space:pre-wrap; border:1px solid var(--line); }
  .me { align-self:flex-end; background:var(--me); }
  .bot { align-self:flex-start; background:var(--bot); }
  .bot.failed { border-color:var(--bad); }
  .note { align-self:flex-start; background:var(--warn-bg); color:var(--warn); border-radius:8px; padding:8px 12px; font-size:13px; }
  .note pre { margin:6px 0 0; white-space:pre-wrap; font-size:12px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); max-width:760px; width:100%; margin:0 auto; }
  input { flex:1; font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); }
  button { font:inherit; padding:10px 16px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#111; } }
  button:disabled, input:disabled { opacity:.5; cursor:default; }
  #reset { background:none; color:var(--muted); border:1px solid var(--line); padding:4px 10px; font-size:13px; }
</style>
</head>
<body>
<header>
  <div><h1>Example Investments assistant</h1><small>Demo: try customer C001, last 4 digits 4412</small></div>
  <button id="reset" type="button">New conversation</button>
</header>
<div id="log" aria-live="polite"></div>
<form id="form">
  <input id="text" autocomplete="off" maxlength="2000" placeholder="Type a message..." autofocus>
  <button id="send" type="submit">Send</button>
</form>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const text = document.getElementById('text');
const send = document.getElementById('send');
let sessionId = null;

function add(cls, content) {
  const el = document.createElement('div');
  el.className = cls;
  el.textContent = content;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function setBusy(busy) {
  text.disabled = send.disabled = busy;
  if (!busy) text.focus();
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const message = text.value.trim();
  if (!message) return;
  text.value = '';
  add('msg me', message);
  const pending = add('msg bot', '...');
  setBusy(true);
  try {
    const response = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message }),
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    sessionId = data.session_id;
    pending.textContent = data.reply;
    if (data.failed) pending.classList.add('failed');
    if (data.escalated) {
      const note = add('note', 'Escalated to a human agent. Handoff summary:');
      const pre = document.createElement('pre');
      pre.textContent = JSON.stringify(data.handoff, null, 2);
      note.appendChild(pre);
    }
  } catch (err) {
    pending.textContent = 'Could not reach the server (' + err.message + ').';
    pending.classList.add('failed');
  } finally {
    setBusy(false);
  }
});

document.getElementById('reset').addEventListener('click', () => {
  sessionId = null;
  log.innerHTML = '';
  text.focus();
});
</script>
</body>
</html>
