agent_name: Example Investments Assistant

guardrails:
  # Escalate to a human after this many failed identity checks.
  max_failed_verifications: 2
  # Coarse backstop on the model's reply; the prompt is the primary control.
  advice_output_patterns:
    - '(?<!whether )(?<!if )\byou should (buy|sell|invest|switch|move)\b'
    - '\bi (strongly )?(recommend|suggest|advise) (that )?(you )?(to )?(buy|sell|invest|switch|move)'
  advice_refusal_message: >-
    I'm not able to give personal investment advice, since that requires a licensed investment
    advisor. I can explain our products and fees, or arrange for a licensed advisor to contact you.
  escalated_reply: >-
    Your request has been passed to a human agent, who will continue from here.
    Thank you for your patience.
